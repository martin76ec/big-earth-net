# Hyperparameter optimization config for downstream Logistic Regression
hpo:
  n_trials: 50
  metric: f1_macro
  direction: maximize
  cv_splits: 5
  cv_repeats: 1
  n_jobs: -1

logistic_regression:
  penalty: l2
  solver: lbfgs
  max_iter: 500
  multi_class: multinomial
  random_state: 42

search_space:
  C:
    type: loguniform
    low: 1.0e-4
    high: 1.0e2
